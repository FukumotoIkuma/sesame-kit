name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same PR/branch when new commits are pushed.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # P5-8 (ARCH-18): linter (biome) と supply-chain audit のゲート。
  # lint は biome.jsonc の方針どおり packages/*/src・scripts・packages/kit/{bin,clients/js} のみ対象 (formatter は無効)。
  # audit は README の「production 依存の脆弱性 0 件」主張を継続検証する (dev 依存は対象外)。
  lint:
    name: Lint & audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (biome)
        run: npm run lint

      - name: Audit production dependencies (high+)
        run: npm audit --omit=dev --audit-level=high

  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Regenerate every committed build artifact (types/*.d.ts via tsc, plus the
      # RPC param schema, gRPC proto/map, OpenRPC doc, and TS/Python SDKs).
      - name: Build generated artifacts
        run: npm run build

      # Drift guard: the committed artifacts must byte-match a fresh build. tsc is
      # version-pinned through npm ci and the generators are deterministic, so any
      # diff here means source changed without running `npm run build`.
      # (types/ used to rot silently because only the JSON/proto artifacts were
      #  guarded — this extends the guard to the whole generated surface.)
      - name: Verify committed artifacts are up to date
        run: |
          git add -A
          if ! git diff --cached --quiet; then
            echo "::error::Committed build artifacts are stale. Run 'npm run build' and commit the result."
            git diff --cached --stat
            exit 1
          fi

      # P5-11 (ARCH-13): 生成 SDK のコンパイル検査。
      # ドリフト確認後のクリーンな生成物に対して tsc と py_compile を通す。
      # これにより生成器が不正構文/型を出すリグレッションを CI で検出できる。
      - name: Typecheck generated TypeScript SDK
        run: npm run typecheck:sdk

      - name: Setup Python for SDK compile check
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Compile-check generated Python SDK
        run: npm run check:sdk:py

      - name: Run tests
        run: npm test

  # 上流コンフォーマンス・カナリア (オフライン replay)。
  # 記録済みの vendor 応答サンプル (packages/kit/tests/fixtures/upstream/*.json) を、live カナリアと同一の
  # stable スキーマ (packages/kit/src/serve/result-schemas.js) で検証し、「スキーマを緩めて契約を壊す」種類の
  # drift を creds 無しで検出する。live カナリア (実クラウド) は creds が要るため CI では回さず
  # opt-in のまま (手動 / スケジュール: `node scripts/canary-upstream.mjs`)。詳細は
  # docs/api-stability.md の canary 節。
  upstream-canary-replay:
    name: Upstream canary (offline replay)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      # 依存不要 (replay は node 標準 fs + result-schemas.js のみ) だが、将来の依存追加に備え ci する。
      - name: Install dependencies
        run: npm ci

      # creds もネットワークも使わない。fixtures が stable スキーマに適合しなければ exit 1。
      - name: Replay recorded upstream responses against stable schemas
        run: node scripts/canary-upstream.mjs --replay

  # P2-1 (R3:ARCH-01): @sesame-kit/core が単体 install で import できることを常時検証する。
  # monorepo の hoisting は依存欠落を隠すため、pack + 隔離 install が唯一の信頼できるゲート。
  # npm pack は lock 非依存(tarball をその場で生成)なので Docker Linux での lock 再生成は不要。
  # ws はレジストリから取得する(これが core の依存宣言が正しいことの証明)。
  core-install-smoke:
    name: "@sesame-kit/core isolated install smoke"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install workspace dependencies (hoisting check baseline)
        run: npm ci

      - name: Pack @sesame-kit/core tarball
        run: npm pack -w packages/core --pack-destination /tmp/core-pack

      - name: Install core tarball in isolation (no workspace hoisting)
        run: |
          mkdir /tmp/core-smoke
          cd /tmp/core-smoke
          # Install the packed tarball; ws must be resolved from the registry, not hoisting.
          npm install /tmp/core-pack/sesame-kit-core-*.tgz
          # Smoke: the entrypoint must resolve without ERR_MODULE_NOT_FOUND.
          node -e "import('@sesame-kit/core').then(() => console.log('smoke: ok')).catch(e => { console.error(e); process.exit(1); })"
