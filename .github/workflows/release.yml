# P5-8 (ARCH-18/ARCH-21): npm publish を tag-push トリガの CI に移譲し provenance を付ける。
#
# フロー: scripts/release.sh が preflight (clean tree / main 同期 / test / build drift /
# 二重リリース防止 / 3 package.json バージョン一致) を通してから v* タグを push →
# この workflow が publish する。
#
# 認証は npm の **trusted publishing (OIDC)** 前提 — NPM_TOKEN シークレットは使わない。
# 事前に npmjs.com の @sesame-kit/core・sesame-kit 各パッケージ設定で、この GitHub リポジトリ +
# このワークフローファイル (release.yml) を Trusted Publisher として登録しておくこと。
# `--provenance` は id-token: write 権限の OIDC トークンで Sigstore 署名付きの
# 出所証明を生成し、npm 上で "Provenance" として検証可能になる。
#
# 生成物 (types/ schema/ sdk/) は commit 済みであり、scripts/release.sh の build drift
# 検査で担保されている。この workflow に prepack は存在しない。
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm (provenance)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance / trusted publishing の OIDC に必須
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          # trusted publishing でも publish 先 registry の明示が必要
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      # タグと全 package.json (root / core / kit) のバージョン不一致で
      # 誤バージョンを公開しないガード。3 ファイルが一致していることも確認する。
      - name: Verify tag matches all package.json versions
        run: |
          ROOT_VER="$(node -p "require('./package.json').version")"
          CORE_VER="$(node -p "require('./packages/core/package.json').version")"
          KIT_VER="$(node -p "require('./packages/kit/package.json').version")"
          KIT_CORE_PIN="$(node -p "require('./packages/kit/package.json').dependencies['@sesame-kit/core']")"
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$ROOT_VER" != "$TAG" ]; then
            echo "::error::tag v${TAG} != root package.json ${ROOT_VER}"
            exit 1
          fi
          if [ "$CORE_VER" != "$TAG" ]; then
            echo "::error::packages/core version ${CORE_VER} != tag ${TAG}"
            exit 1
          fi
          if [ "$KIT_VER" != "$TAG" ]; then
            echo "::error::packages/kit version ${KIT_VER} != tag ${TAG}"
            exit 1
          fi
          if [ "$KIT_CORE_PIN" != "$TAG" ]; then
            echo "::error::packages/kit @sesame-kit/core pin ${KIT_CORE_PIN} != tag ${TAG}"
            exit 1
          fi

      - name: Run tests
        run: npm test

      # NODE_AUTH_TOKEN は設定しない — trusted publishing (OIDC) で認証する。
      # core を先に publish し、その後 kit を publish する (kit は core に依存するため)。
      - name: Publish (provenance)
        run: npm publish --provenance --access public -w packages/core -w packages/kit

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: write # release 作成に必要
    steps:
      - uses: actions/checkout@v6

      # 旧 release.sh の `gh release create --generate-notes` をそのまま CI へ移設。
      - name: Create GitHub Release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes
