# P5-8 (ARCH-18/ARCH-21): npm publish を tag-push トリガの CI に移譲し provenance を付ける。
#
# フロー: scripts/release.sh が preflight (clean tree / main 同期 / test / build drift /
# 二重リリース防止) を通してから v* タグを push → この workflow が publish する。
#
# 認証は npm の **trusted publishing (OIDC)** 前提 — NPM_TOKEN シークレットは使わない。
# 事前に npmjs.com の sesame-kit パッケージ設定で、この GitHub リポジトリ +
# このワークフローファイル (release.yml) を Trusted Publisher として登録しておくこと。
# `--provenance` は id-token: write 権限の OIDC トークンで Sigstore 署名付きの
# 出所証明を生成し、npm 上で "Provenance" として検証可能になる。
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm (provenance)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance / trusted publishing の OIDC に必須
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          # trusted publishing でも publish 先 registry の明示が必要
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      # タグと package.json の不一致 (タグ付け忘れ/手動タグ) で誤バージョンを公開しないガード。
      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} != package.json ${PKG_VERSION}"
            exit 1
          fi

      - name: Run tests
        run: npm test

      # prepack (npm run build) が走り、生成物 (types/ schema/ sdk/) を再生成してから publish する。
      # NODE_AUTH_TOKEN は設定しない — trusted publishing (OIDC) で認証する。
      - name: Publish (provenance)
        run: npm publish --provenance --access public

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: write # release 作成に必要
    steps:
      - uses: actions/checkout@v6

      # 旧 release.sh の `gh release create --generate-notes` をそのまま CI へ移設。
      - name: Create GitHub Release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes
